name: Verify Runtime

on:
  push:
    branches:
      - main
      - radix
  pull_request:
    branches:
      - main
      - radix
  workflow_dispatch:

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run shared release checks
        run: npm run release:ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-web-dist
          path: dist
